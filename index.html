  <script>
    (function () {
      var storageKey = 'vitrism.theme';
      var fallback = 'dark';

      try {
        var stored = window.localStorage.getItem(storageKey);
        var mode = stored === 'dark' || stored === 'light' ? stored : fallback;
        var root = document.documentElement;

        root.setAttribute('data-vtr-theme', mode);
        root.classList.toggle('vtr-theme-light', mode === 'light');
        root.classList.toggle('vtr-theme-dark', mode === 'dark');
        root.style.colorScheme = mode;
      } catch (error) {
        document.documentElement.setAttribute('data-vtr-theme', fallback);
        document.documentElement.classList.add('vtr-theme-dark');
        document.documentElement.style.colorScheme = fallback;
      }
